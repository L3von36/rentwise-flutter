name: Build & Release

# Releases:
#   - Push a tag like v1.0.1          -> full build + GitHub Release
#   - Actions tab -> Run workflow     -> full build + GitHub Release
#     (set "version" input, e.g. v1.0.1; empty = pubspec version)
# Any push to main                  -> full multi-platform build artifacts

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.0.1 (empty = pubspec version)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.24.3'

jobs:
  # ---------------------------------------------------------------- version
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          PUBSPEC_V="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            IS_RELEASE=true
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
            IS_RELEASE=true
          else
            VERSION="v${PUBSPEC_V}"
            IS_RELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${VERSION} is_release=${IS_RELEASE}"

  # ---------------------------------------------------------------- android
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify (analyze + tests)
        run: |
          flutter analyze
          flutter test

      - name: Build release APK (universal)
        run: flutter build apk --release

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/RentWise-${{ needs.version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  build-windows:
    name: Windows desktop
    # windows-2025 image ships a stale CMAKE_GENERATOR env (VS2019, not installed)
    # and no VS2019 toolset -> pin to windows-2022 which has VS2022.
    runs-on: windows-2022
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release app
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: flutter build windows --release

      - name: Stage artifact
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse -Path build/windows/x64/runner/Release `
            -Destination "stage/RentWise-$v-windows-x64"
          Compress-Archive -Path "stage/RentWise-$v-windows-x64" `
            -DestinationPath "stage/RentWise-$v-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "stage/RentWise-$v-windows-x64.zip" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------- macos
  build-macos:
    name: macOS app
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release app
        run: flutter build macos --release

      - name: Stage artifact
        run: |
          V="${{ needs.version.outputs.version }}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/rentwise.app \
            "dist/RentWise-${V}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------ linux
  build-linux:
    name: Linux desktop
    runs-on: ubuntu-22.04
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libblkid-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release bundle
        run: flutter build linux --release

      - name: Stage artifact
        run: |
          V="${{ needs.version.outputs.version }}"
          mkdir -p dist
          tar -czf "dist/RentWise-${V}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Create GitHub release
    if: needs.version.outputs.is_release == 'true'
    needs: [version, build-android, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum -- * > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: RentWise ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            RentWise **${{ needs.version.outputs.version }}** — one calm, connected place for event rental inventory, orders, customers, and activity.

            ## Downloads

            | File | Platform | Notes |
            | --- | --- | --- |
            | `RentWise-*-${{ needs.version.outputs.version }}-android.apk` | Android 5.0+ | Universal APK. Allow "install unknown apps" when sideloading. |
            | `RentWise-*-${{ needs.version.outputs.version }}-windows-x64.zip` | Windows 10/11 (x64) | Extract and run `rentwise.exe`. |
            | `RentWise-*-${{ needs.version.outputs.version }}-macos.zip` | macOS 10.14+ | Unzip and drag `rentwise.app` to Applications. Unsigned build: right-click → **Open** the first time. |
            | `RentWise-*-${{ needs.version.outputs.version }}-linux-x64.tar.gz` | Linux (x64) | `tar -xzf`, then run `./rentwise`. Requires GTK 3. |

            SHA256 checksums are provided in `SHA256SUMS.txt`.

            > Binaries are not code-signed yet — your OS may show a first-run warning.
